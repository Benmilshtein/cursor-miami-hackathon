<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" role="img" aria-label="OKX">
  <!-- Pixel-style OKX mark for dark backgrounds -->
  <g fill="#ffffff">
    <!-- O -->
    <rect x="4" y="8" width="32" height="32" rx="2"/>
    <rect x="14" y="18" width="12" height="12" fill="#061018"/>
    <!-- K -->
    <rect x="48" y="8" width="10" height="32"/>
    <rect x="58" y="18" width="10" height="10"/>
    <rect x="68" y="8" width="10" height="10"/>
    <rect x="68" y="30" width="10" height="10"/>
    <!-- X -->
    <rect x="90" y="8" width="10" height="10"/>
    <rect x="110" y="8" width="10" height="10"/>
    <rect x="100" y="18" width="10" height="10"/>
    <rect x="90" y="30" width="10" height="10"/>
    <rect x="110" y="30" width="10" height="10"/>
  </g>
</svg>
